name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Тесты (логика + интерфейс в headless-режиме)
        run: dotnet test PhotoCommander.sln -c Release
      - name: Скриншоты интерфейса
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: tests/PhotoCommander.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencv-python-headless numpy pillow
      - name: Проверка консольной версии
        run: |
          python - <<'PY'
          import cv2, numpy as np, os
          os.makedirs("t/sub", exist_ok=True)
          img = np.zeros((600, 800, 3), np.uint8)
          for i in range(10):
              cv2.circle(img, (80 * i, 60 * i), 40 + 10 * i, (25 * i, 255 - 25 * i, 100), -1)
          cv2.imwrite("t/a.jpg", img); cv2.imwrite("t/sub/a.jpg", img)
          cv2.imwrite("t/small.jpg", cv2.resize(img, (400, 300)))
          PY
          python python/photo_dedup.py t --move-dups --report report.csv
          test "$(ls t/_duplicates | wc -l)" -ge 1

  publish:
    needs: [test, python]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./publish.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCommander-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
      - name: Архив для релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd publish/${{ matrix.rid }} && zip -r ../../PhotoCommander-${{ matrix.rid }}.zip .
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoCommander-${{ matrix.rid }}.zip
